<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="45%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#9B7B1A" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141420" />
      <stop offset="100%" stop-color="#06060A" />
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="180" height="180" rx="42" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="177" height="177" rx="40.5" stroke="url(#goldGrad)" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Glowing Compass & Navigation Rhombus -->
  <g transform="translate(90, 90)">
    <!-- Outer delicate compass ring -->
    <circle r="60" stroke="url(#goldGrad)" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 6"/>
    <circle r="46" stroke="url(#goldGrad)" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Cardinal ticks -->
    <line x1="0" y1="-64" x2="0" y2="-54" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="54" x2="0" y2="64" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-64" y1="0" x2="-54" y2="0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="54" y1="0" x2="64" y2="0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Compass 4-point star -->
    <path d="M0 -42 L8 -12 L38 0 L8 12 L0 42 L-8 12 L-38 0 L-8 -12 Z" fill="url(#goldGrad)"/>

    <!-- Center inner core -->
    <circle r="7" fill="#0A0A12"/>
    <circle r="3.5" fill="#FFD166"/>
  </g>
</svg>
