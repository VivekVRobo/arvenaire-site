name: One-time ARVENAIRE rebrand

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace ScholarMap branding across text source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git'}
          skip_file = Path('.github/workflows/arvenaire-rebrand.yml')
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts) or path == skip_file:
                  continue
              try:
                  raw = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              # Preserve the currently configured production hostname until the
              # ARVENAIRE domain is actually owned/connected. Replace every
              # other old-brand spelling, including internal text identifiers.
              protected = raw.replace('scholarmap.com', '__ARVENAIRE_OLD_HOST__')
              updated = (protected
                         .replace('ScholarMap', 'ARVENAIRE')
                         .replace('SCHOLARMAP', 'ARVENAIRE')
                         .replace('scholarmap', 'arvenaire')
                         .replace('__ARVENAIRE_OLD_HOST__', 'scholarmap.com'))

              if updated != raw:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Changed {len(changed)} files:')
          for path in changed:
              print(path)
          PY

      - name: Commit rebrand
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No branding changes required."
            exit 0
          fi
          git config user.name "Vivek Vala"
          git config user.email "vivekvala562@gmail.com"
          git add -A
          git commit -m "Rebrand ScholarMap to ARVENAIRE"
          git push origin HEAD:main
